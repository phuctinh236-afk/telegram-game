<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casio World</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

<div class="menu">☰</div>

<div class="logo">
<h2>CASIO</h2>
<p>WORLD</p>
</div>

<div class="support">
💬
</div>

</header>

<div class="banner">
<img id="banner" src="img/banner1.jpg">
</div>

<div class="notice">
<marquee>🎉 Chào mừng đến với Casio World | Nhận 10000 Casio miễn phí khi đăng ký</marquee>
</div>

<div class="wallet">

<div>
<p>Số dư</p>
<h2 id="money">10,000 CC</h2>
</div>

<button>Nạp</button>

</div>

<div class="category">

<button class="active">HOT</button>
<button>Slots</button>
<button>Tài Xỉu</button>
<button>Mini</button>
<button>Event</button>

</div>

<div class="games">

<div class="card">
<img src="img/taixiu.png">
<p>Tài Xỉu</p>
</div>

<div class="card">
<img src="img/slot.png">
<p>Slots</p>
</div>

<div class="card">
<img src="img/spin.png">
<p>Vòng Quay</p>
</div>

<div class="card">
<img src="img/highlow.png">
<p>Cao Thấp</p>
</div>

<div class="card">
<img src="img/mines.png">
<p>Mines</p>
</div>

<div class="card">
<img src="img/dice.png">
<p>Xúc Xắc</p>
</div>

<div class="card">
<img src="img/lucky.png">
<p>Lucky</p>
</div>

<div class="card">
<img src="img/more.png">
<p>Sắp ra mắt</p>
</div>

</div>

<nav>

<button>🏠</button>
<button>🎁</button>
<button>💰</button>
<button>👤</button>

</nav>

<script src="js/main.js"></script>

</body>
</html>
