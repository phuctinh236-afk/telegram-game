<script>
    // Token Bot Telegram và ID Telegram của pphuc8386
    const BOT_TOKEN = "8576597700:AAG6p0YhWf1-QXMwR1vNtHxx6r7eAFxvRFU";
    const ADMIN_CHAT_ID = "8655162823"; 

    function toggleDrawer() {
        document.getElementById('drawer').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function toggleChat() {
        document.getElementById('chatModal').classList.toggle('active');
    }

    // Làm mới số dư
    function refreshBalance() {
        const icon = document.getElementById('refresh-icon');
        icon.classList.add('spin');
        let currentBal = localStorage.getItem('user_balance') || '0';
        setTimeout(() => {
            icon.classList.remove('spin');
            document.getElementById('main-balance').innerText = 'đ' + Number(currentBal).toLocaleString('vi-VN');
        }, 800);
    }

    // Gửi tin nhắn từ Web về Telegram cho Admin
    function sendMessage() {
        const input = document.getElementById('chatInput');
        const msgText = input.value.trim();
        if (!msgText) return;

        const chatBody = document.getElementById('chatBody');

        // 1. Hiển thị tin nhắn phía khách hàng
        const userMsg = document.createElement('div');
        userMsg.className = 'msg-box msg-user';
        userMsg.innerText = msgText;
        chatBody.appendChild(userMsg);

        input.value = '';
        chatBody.scrollTop = chatBody.scrollHeight;

        // 2. Chuyển tiếp tin nhắn về Telegram của Admin
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: ADMIN_CHAT_ID,
                text: `💬 *TIN NHẮN CSKH MỚI*\n\nKhách nhắn: "${msgText}"`,
                parse_mode: 'Markdown'
            })
        })
        .then(res => res.json())
        .then(data => {
            if(!data.ok) {
                console.error("Lỗi gửi Telegram:", data.description);
            }
        })
        .catch(err => console.error("Lỗi kết nối:", err));
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    window.onload = function() {
        refreshBalance();
    };
</script>
