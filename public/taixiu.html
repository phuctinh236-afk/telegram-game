<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bàn Cược Chẵn Lẻ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0b1120; display: flex; justify-content: center; height: 100vh; color: #fff; overflow: hidden; }
        .app-container { width: 100%; max-width: 480px; height: 100%; position: relative; display: flex; flex-direction: column; }

        /* Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        .top-left { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; }
        .top-left i { cursor: pointer; }
        
        .top-stats { display: flex; gap: 10px; padding: 0 15px 15px; justify-content: space-between; align-items: center; }
        .stat-box { background: #1a2332; border: 1px solid #d4af37; border-radius: 20px; padding: 4px 10px; font-size: 10px; display: flex; flex-direction: column; align-items: center; }
        .stat-val { color: #2ecc71; font-weight: bold; font-size: 12px; }
        .icon-btn { width: 30px; height: 30px; background: #1a2332; border: 1px solid #34495e; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #d4af37; font-size: 12px; }

        /* Table Wrapper */
        .table-area { flex: 1; padding: 10px 20px; position: relative; display: flex; justify-content: center; align-items: center; }
        
        /* The Green Oval Table */
        .table { width: 100%; height: 95%; background: #0c4d22; border-radius: 120px; border: 4px solid #1a7037; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }

        /* Center Bowl */
        .center-bowl { width: 80px; height: 80px; background: #e67e22; border-radius: 50%; border: 4px solid #f1c40f; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 30px; position: absolute; z-index: 10; }

        /* Betting Areas (Chẵn / Lẻ) */
        .bet-areas { position: absolute; top: 40%; width: 70%; display: flex; justify-content: space-between; left: 15%; }
        .bet-box { border: 1px solid #f1c40f; border-radius: 8px; width: 45%; padding: 10px 0; text-align: center; background: rgba(0,0,0,0.2); }
        .bet-title { color: #f1c40f; font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        .bet-odds { font-size: 9px; color: #aaa; margin-bottom: 4px; }
        .bet-val { color: #2ecc71; font-weight: bold; font-size: 14px; }

        /* Players */
        .player { position: absolute; display: flex; flex-direction: column; align-items: center; font-size: 9px; width: 60px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #e74c3c; background: #333; overflow: hidden; position: relative; margin-bottom: 3px; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .vip-badge { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #f39c12; color: #000; font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 4px; border: 1px solid #fff; }
        
        .p-name { color: #fff; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-bal { color: #aaa; }

        /* Positions */
        .p-top { top: -20px; left: 50%; transform: translateX(-50%); }
        .p-top .avatar { border-color: #f1c40f; width: 50px; height: 50px; }
        .p-left-1 { top: 10%; left: 0; }
        .p-left-2 { top: 30%; left: -10px; }
        .p-right-1 { top: 10%; right: 0; }
        .p-right-2 { top: 30%; right: -10px; }
        .p-right-3 { top: 50%; right: 0; }

    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <div class="top-bar">
            <div class="top-left">
                <i class="fa-solid fa-xmark" onclick="window.location.href='index.html'"></i> Ab666
            </div>
            <i class="fa-solid fa-angle-down" style="font-size: 20px;"></i>
            <i class="fa-solid fa-ellipsis-vertical" style="font-size: 20px;"></i>
        </div>

        <div class="top-stats">
            <div class="stat-box" style="border-color:#e67e22; color:#e67e22;">
                MINI GAME <div style="color:#fff; font-size:12px;">🎲 42</div>
            </div>
            <div class="stat-box" style="border-color:#d4af37; color:#d4af37;">
                HŨ THƯỞNG <div class="stat-val">6,399,700</div>
            </div>
            <div class="stat-box" style="border-color:#2ecc71; color:#2ecc71; flex-direction:row; gap:5px;">
                250% <span>🎲🎲🎲</span>
            </div>
            <div class="icon-btn"><i class="fa-solid fa-user-group"></i></div>
            <div class="icon-btn"><i class="fa-solid fa-comment-dots"></i></div>
        </div>

        <!-- Game Table Area -->
        <div class="table-area">
            <div class="table">
                
                <!-- Main Dealer / Top Player -->
                <div class="player p-top">
                    <div class="avatar"><img src="https://via.placeholder.com/50"></div>
                </div>

                <!-- Left Players -->
                <div class="player p-left-1">
                    <div class="avatar"><img src="https://via.placeholder.com/45"><div class="vip-badge">VIP2</div></div>
                    <div class="p-name">hleunghia</div><div class="p-bal">13,57M</div>
                </div>
                <div class="player p-left-2">
                    <div class="avatar"><img src="https://via.placeholder.com/45"><div class="vip-badge">VIP3</div></div>
                    <div class="p-name">vodanh99</div><div class="p-bal">9,81M</div>
                </div>

                <!-- Right Players -->
                <div class="player p-right-1">
                    <div class="avatar"><img src="https://via.placeholder.com/45"><div class="vip-badge">VIP6</div></div>
                    <div class="p-name">Duyhung66</div><div class="p-bal">9,5M</div>
                </div>
                <div class="player p-right-2">
                    <div class="avatar"><img src="https://via.placeholder.com/45"><div class="vip-badge">VIP6</div></div>
                    <div class="p-name">Mangna</div><div class="p-bal">15,87M</div>
                </div>
                <div class="player p-right-3">
                    <div class="avatar"><img src="https://via.placeholder.com/45"><div class="vip-badge">VIP6</div></div>
                    <div class="p-name">donkihote</div><div class="p-bal">55,72M</div>
                </div>

                <!-- Betting Options -->
                <div class="bet-areas">
                    <div class="bet-box">
                        <div class="bet-title">CHẴN</div>
                        <div class="bet-odds">1:0.96</div>
                        <div class="bet-val">0</div>
                    </div>
                    <div class="bet-box">
                        <div class="bet-title">LẺ</div>
                        <div class="bet-odds">1:0.96</div>
                        <div class="bet-val">0</div>
                    </div>
                </div>

                <!-- Center Dice Bowl -->
                <div class="center-bowl">🍲</div>
                
            </div>
        </div>
    </div>
</body>
</html>
