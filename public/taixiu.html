<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BÀN TÀI XỈU VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f5e3a5;
        }

        body {
            background-color: #1a0f00;
            background-image: radial-gradient(circle, #3b250a 1px, #1a0f00 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 650px;
            background: linear-gradient(135deg, #4b3621 0%, #2c1a0b 100%);
            border: 5px solid #c5a059;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        .header {
            text-align: center;
            width: 100%;
            margin-bottom: 15px;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 2px 5px #000;
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
        }
        .header-title::before, .header-title::after {
            content: '🎲';
            position: absolute;
            top: -2px;
            font-size: 18px;
        }
        .header-title::before { left: -30px; }
        .header-title::after { right: -30px; }

        .marquee-container {
            width: 95%;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
            line-height: 1.4;
            border: 1px solid #c5a059;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .highlight-win { color: #50e677; font-weight: bold; }
        .highlight-money { color: #ffcc00; font-weight: bold; }

        .dice-area {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .dice-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .dice {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: black;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .status-text { font-size: 16px; color: #ffcc00; height: 22px; }

        .bet-table {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        .bet-box {
            width: 140px;
            height: 90px;
            background: linear-gradient(to bottom, #4b3621 0%, #1a0f00 100%);
            border: 3px solid #c5a059;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .bet-box.selected { border-color: #50e677; box-shadow: 0 0 15px #50e677; }
        .bet-box.disabled { opacity: 0.5; cursor: not-allowed; }

        .bet-title {
            font-size: 32px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
            color: #f5e3a5;
        }
        .bet-current-money {
            font-size: 13px;
            color: #fff;
        }

        .timer-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(to bottom, #c5a059 0%, #8a6e3f 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            border: 2px solid #fff;
        }

        .instruction-text {
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
            color: #d9c48e;
            width: 100%;
        }

        .chip-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 20px;
        }
        .chip {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #f5e3a5 0%, #c5a059 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: #3b250a;
            cursor: pointer;
            box-shadow: 0 4px 0 #8a6e3f;
        }
        .chip.selected { transform: translateY(-4px); box-shadow: 0 8px 12px rgba(0,0,0,0.5); border: 2px solid #fff; }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .btn {
            width: 150px;
            height: 45px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
        }
        .btn-cancel {
            background: linear-gradient(to bottom, #d63031 0%, #8B0000 100%);
            color: #ffffff !important;
            box-shadow: 0 4px 0 #5a0000;
        }
        .btn-confirm {
            background: linear-gradient(to bottom, #27ae60 0%, #145a32 100%);
            color: #ffffff !important;
            box-shadow: 0 4px 0 #0b381e;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <span class="header-title">BÀN TÀI XỈU VIP</span>
        </div>

        <div class="marquee-container" id="marquee-text">
            Chúc mừng <span class="highlight-win">VipPro99</span> thắng <span class="highlight-money">520,000</span>
        </div>

        <div class="dice-area">
            <div class="dice-row">
                <div class="dice" id="d1">🎲</div>
                <div class="dice" id="d2">🎲</div>
                <div class="dice" id="d3">🎲</div>
            </div>
            <div class="status-text" id="status-label">(Đang chờ cược)</div>
        </div>

        <div class="bet-table">
            <div class="bet-box" id="box-xiu" onclick="chonCua('xiu')">
                <div class="bet-title">XỈU</div>
                <div class="bet-current-money">Cược: <span id="money-xiu">0</span></div>
            </div>

            <div class="timer-circle" id="timer">20</div>

            <div class="bet-box" id="box-tai" onclick="chonCua('tai')">
                <div class="bet-title">TÀI</div>
                <div class="bet-current-money">Cược: <span id="money-tai">0</span></div>
            </div>
        </div>

        <div class="instruction-text" id="instruction">Vui lòng chọn Phính cược và cửa đặt!</div>

        <div class="chip-row">
            <div class="chip selected" onclick="chonChip(1000, this)">1K</div>
            <div class="chip" onclick="chonChip(5000, this)">5K</div>
            <div class="chip" onclick="chonChip(10000, this)">10K</div>
            <div class="chip" onclick="chonChip(50000, this)">50K</div>
            <div class="chip" onclick="chonChip(500000, this)">500K</div>
        </div>

        <div class="button-row">
            <button class="btn btn-cancel" onclick="huyCuoc()">HỦY CƯỢC</button>
            <button class="btn btn-confirm" onclick="xacNhan()">XÁC NHẬN CƯỢC</button>
        </div>
    </div>

    <script>
        let phỉnhChọn = 1000;
        let cửaChọn = null; // 'xiu' hoặc 'tai'
        let cượcXiu = 0;
        let cượcTai = 0;
        let timeLeft = 20;
        let isBetting = true;

        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function chonChip(val, el) {
            if (!isBetting) return;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            phỉnhChọn = val;
        }

        function chonCua(cửa) {
            if (!isBetting) return;
            // Nếu đã đặt bên kia rồi thì không cho chọn sang bên này trong ván này
            if (cửaChọn !== null && cửaChọn !== cửa) {
                alert("Bạn đã đặt cược ở cửa bên kia! Vui lòng đợi ván sau.");
                return;
            }

            cửaChọn = cửa;
            document.querySelectorAll('.bet-box').forEach(b => b.classList.remove('selected'));
            document.getElementById('box-' + cửa).classList.add('selected');

            // Khóa cửa ngược lại không cho bấm
            if (cửa === 'xiu') {
                document.getElementById('box-tai').classList.add('disabled');
            } else {
                document.getElementById('box-xiu').classList.add('disabled');
            }
        }

        function xacNhan() {
            if (!isBetting) {
                alert("Đã hết thời gian cược!");
                return;
            }
            if (!cửaChọn) {
                alert("Vui lòng chọn cửa Tài hoặc Xỉu!");
                return;
            }
            if (cửaChọn === 'xiu') {
                cượcXiu += phỉnhChọn;
                document.getElementById('money-xiu').innerText = cượcXiu.toLocaleString();
            } else {
                cượcTai += phỉnhChọn;
                document.getElementById('money-tai').innerText = cượcTai.toLocaleString();
            }
            document.getElementById('status-label').innerText = "Đã đặt thành công!";
        }

        function huyCuoc() {
            if (!isBetting) return;
            cượcXiu = 0;
            cượcTai = 0;
            cửaChọn = null;
            document.getElementById('money-xiu').innerText = '0';
            document.getElementById('money-tai').innerText = '0';
            document.querySelectorAll('.bet-box').forEach(b => {
                b.classList.remove('selected');
                b.classList.remove('disabled');
            });
            document.getElementById('status-label').innerText = "Đã hủy cược!";
        }

        // Vòng lặp đếm ngược và quay xúc xắc tự động
        setInterval(() => {
            if (isBetting) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;

                if (timeLeft <= 3 && timeLeft > 0) {
                    document.getElementById('status-label').innerText = "Sắp khóa cược...";
                }

                if (timeLeft <= 0) {
                    isBetting = false;
                    document.getElementById('timer').innerText = "0";
                    document.getElementById('status-label').innerText = "Đang lắc xúc xắc...";

                    // Quay xúc xắc sau 1 giây
                    setTimeout(() => {
                        let d1 = Math.floor(Math.random() * 6);
                        let d2 = Math.floor(Math.random() * 6);
                        let d3 = Math.floor(Math.random() * 6);

                        document.getElementById('d1').innerText = diceFaces[d1];
                        document.getElementById('d2').innerText = diceFaces[d2];
                        document.getElementById('d3').innerText = diceFaces[d3];

                        let total = (d1 + 1) + (d2 + 1) + (d3 + 1);
                        let ketQuaText = total >= 11 ? "TÀI" : "XỈU";
                        document.getElementById('status-label').innerText = `Kết quả: ${total} (${ketQuaText})`;

                        // Chờ 4 giây rồi reset sang ván mới
                        setTimeout(() => {
                            timeLeft = 20;
                            cượcXiu = 0;
                            cượcTai = 0;
                            cửaChọn = null;
                            isBetting = true;
                            document.getElementById('money-xiu').innerText = '0';
                            document.getElementById('money-tai').innerText = '0';
                            document.querySelectorAll('.bet-box').forEach(b => {
                                b.classList.remove('selected');
                                b.classList.remove('disabled');
                            });
                            document.getElementById('d1').innerText = '🎲';
                            document.getElementById('d2').innerText = '🎲';
                            document.getElementById('d3').innerText = '🎲';
                            document.getElementById('status-label').innerText = "(Đang chờ cược)";
                        }, 4000);

                    }, 1000);
                }
            }
        }, 1000);

        // Thông báo ngẫu nhiên người thắng > 100K
        const dsNames = ["HoangTuan", "GamerVip", "ThangLon68", "TaiXiuPro", "PhucGaming", "GodLuck", "SieuThan", "ManhCuong"];
        setInterval(() => {
            let randomName = dsNames[Math.floor(Math.random() * dsNames.length)];
            let randomMoney = Math.floor(Math.random() * 15000000) + 100000;
            document.getElementById('marquee-text').innerHTML = 
                `Chúc mừng <span class="highlight-win">${randomName}</span> thắng <span class="highlight-money">${randomMoney.toLocaleString()}</span>`;
        }, 5000);
    </script>
</body>
</html>
