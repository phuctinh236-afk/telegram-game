<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BÀN TÀI XỈU VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0704;
            background-image: radial-gradient(circle, #221408 1px, #0b0704 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 410px;
            height: 670px;
            background: linear-gradient(135deg, #2b1d0c 0%, #110b04 100%);
            border: 4px solid #8c6732;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        /* Thông báo người thắng */
        .marquee-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 11px;
            text-align: center;
            border: 1px solid #c5a059;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .highlight-win { color: #50e677; font-weight: bold; }
        .highlight-money { color: #ffcc00; font-weight: bold; }

        /* Bàn nỉ xanh bầu dục */
        .casino-table {
            width: 100%;
            height: 340px;
            background: radial-gradient(ellipse at center, #145a32 0%, #092e1b 100%);
            border: 7px solid #4a2e12;
            border-radius: 160px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.6);
            margin-bottom: 12px;
        }

        /* Ô cược Tài / Xỉu */
        .bet-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 110px;
            height: 100px;
            cursor: pointer;
            z-index: 10;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .bet-area.selected {
            background: rgba(255, 255, 255, 0.1);
        }
        .bet-area.disabled { opacity: 0.3; pointer-events: none; }

        .bet-label {
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 4px;
        }

        .bet-input-box {
            background: #6e4c1e;
            border: 2px solid #d4af37;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            width: 90px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }

        .bet-area.selected .bet-input-box {
            border-color: #50e677;
            box-shadow: 0 0 12px #50e677;
        }

        /* Khu vực bát úp & xúc xắc ở giữa */
        .center-bowl-area {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            width: 120px;
            height: 120px;
        }

        .dice-plate {
            width: 85px;
            height: 85px;
            background: #2a180c;
            border: 3px solid #d4af37;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.6);
        }

        .dice {
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #000;
            box-shadow: 0 2px 3px rgba(0,0,0,0.5);
            font-weight: bold;
        }

        /* Cái chén úp (bát) chân thực */
        .bowl {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 78px;
            height: 68px;
            background: linear-gradient(135deg, #6d4629 0%, #30180a 100%);
            border: 3px solid #e6ca65;
            border-radius: 50% 50% 12px 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            z-index: 20;
        }
        .bowl::after {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 12px;
            background: #e6ca65;
            border-radius: 50%;
            border: 2px solid #30180a;
        }
        .bowl.open {
            transform: translate(65px, -55px) rotate(30deg);
            opacity: 0;
            pointer-events: none;
        }

        .timer-badge {
            margin-top: 6px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 1px 10px;
            font-size: 13px;
            font-weight: bold;
            color: #ffcc00;
        }

        .status-msg {
            font-size: 11px;
            color: #50e677;
            margin-top: 2px;
            font-weight: bold;
            height: 15px;
        }

        /* Hàng chọn phỉnh cược */
        .chip-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
            margin-bottom: 12px;
        }
        .chip {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #f5e3a5 0%, #c5a059 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: #3b250a;
            cursor: pointer;
            box-shadow: 0 4px 0 #7c5c2d;
            border: 2px dashed #3b250a;
        }
        .chip.selected {
            transform: translateY(-4px);
            box-shadow: 0 8px 10px rgba(0,0,0,0.6);
            border: 2px solid #fff;
            background: radial-gradient(circle, #fff 0%, #f39c12 100%);
            color: #000;
        }

        /* Nút Bet & Cancel */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .btn {
            width: 165px;
            height: 45px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #a67c52;
            color: #fff;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .btn-cancel {
            background: linear-gradient(to bottom, #c0392b 0%, #641e16 100%);
            border-color: #e74c3c;
        }
        .btn-confirm {
            background: linear-gradient(to bottom, #27ae60 0%, #145a32 100%);
            border-color: #50e677;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Thông báo người thắng -->
        <div class="marquee-container" id="marquee-text">
            Chúc mừng <span class="highlight-win">ManhCuong</span> thắng <span class="highlight-money">1,467,283</span>
        </div>

        <!-- Bàn nỉ xanh -->
        <div class="casino-table">
            <!-- Cửa TÀI -->
            <div class="bet-area" id="box-tai" onclick="chonCua('tai')">
                <div class="bet-label" style="color: #ffcc00;">TÀI</div>
                <div class="bet-input-box" id="money-tai">0</div>
            </div>

            <!-- Khu vực bát úp & xúc xắc -->
            <div class="center-bowl-area">
                <div class="dice-plate">
                    <div class="bowl" id="bowl-cover"></div>
                    <div class="dice" id="d1">⚀</div>
                    <div class="dice" id="d2">⚁</div>
                    <div class="dice" id="d3">⚂</div>
                </div>
                <div class="timer-badge"><span id="timer">20</span>s</div>
                <div class="status-msg" id="status-label">Đang mở cược</div>
            </div>

            <!-- Cửa XỈU -->
            <div class="bet-area" id="box-xiu" onclick="chonCua('xiu')">
                <div class="bet-label" style="color: #ff9f43;">XỈU</div>
                <div class="bet-input-box" id="money-xiu">0</div>
            </div>
        </div>

        <!-- Hàng chọn phỉnh -->
        <div class="chip-row">
            <div class="chip selected" onclick="chonChip(1000, this)">1K</div>
            <div class="chip" onclick="chonChip(5000, this)">5K</div>
            <div class="chip" onclick="chonChip(10000, this)">10K</div>
            <div class="chip" onclick="chonChip(15000, this)">15K</div>
            <div class="chip" onclick="chonChip(20000, this)">20K</div>
            <div class="chip" onclick="chonChip(30000, this)">30K</div>
        </div>

        <!-- Nút Cancel & Bet -->
        <div class="button-row">
            <button class="btn btn-cancel" onclick="huyCuoc()">Cancel</button>
            <button class="btn btn-confirm" onclick="xacNhan()">Bet</button>
        </div>
    </div>

    <script>
        let phỉnhChọn = 1000;
        let cửaChọn = null; 
        let cượcTai = 0;
        let cượcXiu = 0;
        let timeLeft = 20;
        let isBetting = true;

        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function chonChip(val, el) {
            if (!isBetting) return;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            phỉnhChọn = val;
        }

        function chonCua(cửa) {
            if (!isBetting) return;
            // Chỉ cho đặt 1 bên trong 1 ván
            if (cửaChọn !== null && cửaChọn !== cửa) {
                alert("Bạn chỉ được đặt 1 bên trong ván này!");
                return;
            }

            cửaChọn = cửa;
            document.querySelectorAll('.bet-area').forEach(b => b.classList.remove('selected'));
            document.getElementById('box-' + cửa).classList.add('selected');

            if (cửa === 'tai') {
                document.getElementById('box-xiu').classList.add('disabled');
            } else {
                document.getElementById('box-tai').classList.add('disabled');
            }
        }

        function xacNhan() {
            if (!isBetting) {
                alert("Đã hết thời gian cược!");
                return;
            }
            if (!cửaChọn) {
                alert("Vui lòng chọn cửa Tài hoặc Xỉu trước!");
                return;
            }

            if (cửaChọn === 'tai') {
                cượcTai += phỉnhChọn;
                document.getElementById('money-tai').innerText = cượcTai.toLocaleString();
            } else {
                cượcXiu += phỉnhChọn;
                document.getElementById('money-xiu').innerText = cượcXiu.toLocaleString();
            }
            document.getElementById('status-label').innerText = "Đã Bet thành công!";
        }

        function huyCuoc() {
            if (!isBetting) return;
            cượcTai = 0;
            cượcXiu = 0;
            cửaChọn = null;
            document.getElementById('money-tai').innerText = '0';
            document.getElementById('money-xiu').innerText = '0';
            document.querySelectorAll('.bet-area').forEach(b => {
                b.classList.remove('selected');
                b.classList.remove('disabled');
            });
            document.getElementById('status-label').innerText = "Đã hủy cược";
        }

        // Vòng lặp đếm ngược & mở bát
        setInterval(() => {
            if (isBetting) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;

                if (timeLeft <= 3 && timeLeft > 0) {
                    document.getElementById('status-label').innerText = "Sắp mở bát...";
                }

                if (timeLeft <= 0) {
                    isBetting = false;
                    document.getElementById('timer').innerText = "0";
                    document.getElementById('status-label').innerText = "Đang mở bát...";

                    setTimeout(() => {
                        document.getElementById('bowl-cover').classList.add('open');

                        let d1 = Math.floor(Math.random() * 6);
                        let d2 = Math.floor(Math.random() * 6);
                        let d3 = Math.floor(Math.random() * 6);

                        document.getElementById('d1').innerText = diceFaces[d1];
                        document.getElementById('d2').innerText = diceFaces[d2];
                        document.getElementById('d3').innerText = diceFaces[d3];

                        let total = (d1 + 1) + (d2 + 1) + (d3 + 1);
                        let ketQuaText = total >= 11 ? "TÀI" : "XỈU";
                        document.getElementById('status-label').innerText = `${total} (${ketQuaText})`;

                        setTimeout(() => {
                            document.getElementById('bowl-cover').classList.remove('open');
                            timeLeft = 20;
                            cượcTai = 0;
                            cượcXiu = 0;
                            cửaChọn = null;
                            isBetting = true;
                            document.getElementById('money-tai').innerText = '0';
                            document.getElementById('money-xiu').innerText = '0';
                            document.querySelectorAll('.bet-area').forEach(b => {
                                b.classList.remove('selected');
                                b.classList.remove('disabled');
                            });
                            document.getElementById('status-label').innerText = "Đang mở cược";
                        }, 4000);

                    }, 1000);
                }
            }
        }, 1000);

        // Thông báo ngẫu nhiên người thắng > 100K
        const dsNames = ["HoangTuan", "GamerVip", "ThangLon68", "TaiXiuPro", "PhucGaming", "GodLuck", "SieuThan", "ManhCuong"];
        setInterval(() => {
            let randomName = dsNames[Math.floor(Math.random() * dsNames.length)];
            let randomMoney = Math.floor(Math.random() * 12000000) + 100000;
            document.getElementById('marquee-text').innerHTML = 
                `Chúc mừng <span class="highlight-win">${randomName}</span> thắng <span class="highlight-money">${randomMoney.toLocaleString()}</span>`;
        }, 5000);
    </script>
</body>
</html>
