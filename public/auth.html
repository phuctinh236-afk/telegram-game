<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập / Đăng ký</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #141827;
            --bg-surface: #1e253c;
            --gold-primary: #eebf63;
            --text-light: #ffffff;
            --text-muted: #8b95b1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: var(--text-light); display: flex; justify-content: center; height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100%; background-color: var(--bg-main); display: flex; flex-direction: column; }

        .auth-header { background-color: var(--gold-primary); color: #000; padding: 15px; text-align: center; font-weight: bold; position: relative; }
        .auth-close { position: absolute; right: 15px; top: 15px; cursor: pointer; text-decoration: none; color: #000; }

        .auth-logo { text-align: center; padding: 30px 0; color: var(--gold-primary); }
        .auth-logo i { font-size: 40px; }

        .form { padding: 0 20px; flex: 1; }
        .input-group { background: var(--bg-surface); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid transparent; }
        .input-group.active { border-color: var(--gold-primary); }
        label { font-size: 12px; display: block; margin-bottom: 5px; }
        input { width: 100%; background: transparent; border: none; color: #fff; font-size: 13px; outline: none; }

        .submit-btn { background: var(--gold-primary); color: #000; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; }
        .footer a { color: var(--gold-primary); text-decoration: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="auth-header">
            Đăng nhập
            <a href="lobby.html" class="auth-close"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <div class="auth-logo">
            <i class="fa-brands fa-monero"></i>
            <h1 style="font-size:14px; font-weight:normal; margin-top:5px;">MEGA CASINO WORLD</h1>
        </div>

        <div class="form">
            <div class="input-group active">
                <label>Tên đăng nhập</label>
                <input type="text" placeholder="gồm 4 ~ 16 ký tự, bao gồm chữ & số">
            </div>
            <div class="input-group">
                <label>Mật khẩu</label>
                <div style="display:flex; justify-content:space-between;">
                    <input type="password" placeholder="6–20 ký tự và số">
                    <span style="color:var(--gold-primary); font-size:11px; cursor:pointer;">Quên mật khẩu</span>
                </div>
            </div>

            <button class="submit-btn" onclick="window.location.href='lobby.html'">Đăng nhập</button>

            <div class="footer">
                Bạn chưa có tài khoản? <a href="#">Đăng ký</a>
            </div>
        </div>
    </div>
</body>
</html>
