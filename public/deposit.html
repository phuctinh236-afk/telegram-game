<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nạp tiền</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #141827;
            --bg-surface: #1e253c;
            --gold-primary: #eebf63;
            --text-light: #ffffff;
            --text-muted: #8b95b1;
            --border-color: #2e3753;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000; color: var(--text-light); display: flex; justify-content: center; height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100%; background-color: var(--bg-main); display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; }
        .back-btn { background: #e74c3c; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 12px; }
        .logo-text { font-size: 14px; font-weight: bold; color: var(--gold-primary); }

        .tabs { display: flex; margin: 10px 15px; background: var(--bg-surface); border-radius: 8px; padding: 3px; }
        .tab-btn { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: bold; color: var(--text-muted); border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: linear-gradient(180deg, #dfb461, #b58d3c); color: #000; }

        .section { padding: 0 15px; margin-bottom: 15px; }
        .sec-title { font-size: 12px; color: var(--gold-primary); margin-bottom: 8px; }
        select, input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

        .box-btn { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; color: var(--text-muted); cursor: pointer; }
        .box-btn.active { border-color: var(--gold-primary); color: var(--gold-primary); }
        .gateway-btn.active { background: var(--gold-primary); color: #000; font-weight: bold; }

        .submit-btn { background: linear-gradient(180deg, #dfb461, #b58d3c); color: #000; font-weight: bold; border: none; width: calc(100% - 30px); margin: 10px 15px; padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <a href="lobby.html" class="back-btn">← Lại</a>
            <span class="logo-text">MEGA CASINO WORLD</span>
            <span style="font-size: 11px; color: var(--text-muted);"><i class="fa-regular fa-comment-dots"></i> CSKH</span>
        </div>

        <div class="tabs">
            <div class="tab-btn active">Nạp tiền</div>
            <div class="tab-btn">Rút tiền</div>
        </div>

        <div class="section">
            <div class="sec-title">🎁 Khuyến mãi</div>
            <select><option>Nạp Tiền Thông Thường</option></select>
        </div>

        <div class="section">
            <div class="sec-title">💳 Phương thức thanh toán</div>
            <div class="grid-2">
                <div class="box-btn active"><i class="fa-solid fa-building-columns"></i> Ngân hàng</div>
                <div class="box-btn"><i class="fa-solid fa-mobile-screen"></i> MOMOPAY</div>
                <div class="box-btn"><i class="fa-solid fa-heart" style="color:yellow;"></i> ZaloPay</div>
                <div class="box-btn"><i class="fa-solid fa-circle" style="color:red;"></i> ViettelPay</div>
            </div>
        </div>

        <div class="section">
            <div class="sec-title">⚙️ Cổng nạp</div>
            <div class="grid-3">
                <div class="box-btn gateway-btn active">HN-Pay1</div>
                <div class="box-btn gateway-btn">O-Pay</div>
                <div class="box-btn gateway-btn">D-Pay</div>
            </div>
        </div>

        <div class="section">
            <div class="sec-title">💵 Số tiền Nạp (1 = 1K)</div>
            <div class="grid-4" style="margin-bottom: 10px;">
                <div class="box-btn">100</div><div class="box-btn">200</div><div class="box-btn">500</div><div class="box-btn">1.000</div>
                <div class="box-btn">2.000</div><div class="box-btn">5.000</div><div class="box-btn">10.000</div><div class="box-btn">50.000</div>
            </div>
            <input type="number" placeholder="Nhập số tiền..." value="10000000">
        </div>

        <button class="submit-btn" onclick="alert('Gửi yêu cầu thành công!')">Gửi</button>
    </div>
</body>
</html>
